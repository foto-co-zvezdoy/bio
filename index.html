<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>questes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }

    section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
    }

    .bio {
      justify-content: flex-start;
      padding-top: 22vh;
      background: radial-gradient(circle at 50% 0%, #151726 0%, #000 65%);
    }

    .contacts {
      justify-content: center;
      background: #000;
    }

    .box {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 20px;
    }

    .description {
      background: #0c0d12;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 22px 24px;
      font-size: 14px;
      line-height: 1.6;
      color: #9ea3b5;
    }

    .scroll-arrow {
      position: absolute;
      bottom: 24px;
      display: flex;
      animation: bounce 2s infinite ease-in-out;
    }

    .scroll-arrow svg {
      width: 22px;
      height: 22px;
      fill: #3c4050;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(6px);
      }
      60% {
        transform: translateY(3px);
      }
    }

    h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #555869;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 22px;
      background: #0c0d12;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      text-decoration: none;
      transition: 0.2s ease;
      user-select: none;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .item-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-icon svg {
      width: 100%;
      height: 100%;
      fill: #fff;
    }

    .item-name {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.1px;
    }

    .arrow {
      width: 16px;
      height: 16px;
      fill: #3c4050;
      transition: 0.2s ease;
    }

    .item:hover {
      background: #141722;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .item:hover .arrow {
      fill: #8b90a5;
      transform: translateX(2px);
    }

    .item:active {
      transform: scale(0.98);
      background: #08090d;
    }
  </style>
</head>
